<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NSBL App | National Seed Bank of Lebanon</title>
<meta name="description" content="Clickable prototype of the National Seed Bank of Lebanon app.">
<meta name="theme-color" content="#112C3D">
<link rel="icon" type="image/png" href="assets/favicon.png">
<!-- NSBL app prototype. Plain HTML/CSS/JS, works offline, no libraries.
     Screens: 05 Digital/Website Screens/NSBL_App_Screen_1..8.png, copied as they are (no crop, no edit).
     Tap the right half of the phone (or press →) for next, the left half (or ←) for back, or use the dots. -->
<style>
@font-face { font-family: "Secular One"; src: url("assets/fonts/SecularOne-Regular.ttf") format("truetype"); font-display: swap; }
:root { --navy: #112C3D; --cream: #FAF9F5; --amber: #F2B43D; --grey: #989EA7; --line: rgba(250,249,245,.22); }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--navy); color: var(--cream);
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: clamp(12px, 2.2vh, 22px); padding: clamp(14px, 3vh, 32px) 16px; min-height: 100vh; min-height: 100svh;
  -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none;
}
.top { display: flex; align-items: center; gap: 14px; }
.top img { height: clamp(30px, 4.4vh, 42px); width: auto; display: block; }
.top span { font-size: 11px; letter-spacing: .24em; text-transform: uppercase; color: var(--grey); padding-left: 14px; border-left: 1px solid var(--line); }

/* The phone: the screens already include their own phone outline, so they are shown as they are,
   in a box with exactly their ratio (820 × 1670). Never cropped. */
.phone { position: relative; height: min(76vh, 760px); height: min(76svh, 760px); aspect-ratio: 820 / 1670; max-width: calc(100vw - 32px); }
.phone img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; opacity: 0; transition: opacity .25s ease; pointer-events: none; border-radius: 9% / 4.4%; }
.phone img.is-on { opacity: 1; }
.tap { position: absolute; top: 0; bottom: 0; width: 50%; background: none; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.tap--prev { left: 0; cursor: w-resize; } .tap--next { right: 0; cursor: e-resize; }
.tap:focus-visible { outline: 3px solid var(--amber); outline-offset: 4px; border-radius: 12px; }

.title { text-align: center; min-height: 3.2em; }
.title small { display: block; font-size: 11px; letter-spacing: .24em; text-transform: uppercase; color: var(--amber); margin-bottom: 6px; }
.title b { font-family: "Secular One", system-ui, sans-serif; font-weight: 400; font-size: clamp(1.25rem, 2.4vw, 1.7rem); }

.dots { display: flex; gap: 6px; }
.dots button { width: 28px; height: 28px; padding: 0; border: 0; background: none; cursor: pointer; display: grid; place-items: center; }
.dots button::before { content: ""; width: 9px; height: 9px; border-radius: 6px; background: rgba(250,249,245,.28); transition: width .2s, background .2s; }
.dots button[aria-current="true"]::before { width: 24px; background: var(--amber); }
.dots button:focus-visible { outline: 2px solid var(--amber); border-radius: 6px; }
.hint { font-size: 12px; color: var(--grey); margin: 0; }

@media (prefers-reduced-motion: reduce) { .phone img, .dots button::before { transition: none; } }
@media (max-height: 640px) { .hint { display: none; } }
</style>
</head>
<body>
<header class="top"><img src="assets/horizontal-cream.png" alt="NSBL, National Seed Bank of Lebanon" width="520" height="180"><span>App prototype</span></header>

<main class="phone" aria-roledescription="carousel" aria-label="NSBL app screens">
  <img src="assets/screens/screen-1.png" width="820" height="1670" alt="App screen 1: It’s Beyond Roots, welcome screen" class="is-on">
  <img src="assets/screens/screen-2.png" width="820" height="1670" alt="App screen 2: Resting Status">
  <img src="assets/screens/screen-3.png" width="820" height="1670" alt="App screen 3: The Living Collection">
  <img src="assets/screens/screen-4.png" width="820" height="1670" alt="App screen 4: Lebanese Emmer Wheat, seed detail">
  <img src="assets/screens/screen-5.png" width="820" height="1670" alt="App screen 5: The Seed Journey">
  <img src="assets/screens/screen-6.png" width="820" height="1670" alt="App screen 6: Arctic Sovereign Backup">
  <img src="assets/screens/screen-7.png" width="820" height="1670" alt="App screen 7: Scan Seed Passport">
  <img src="assets/screens/screen-8.png" width="820" height="1670" alt="App screen 8: LARI Central Station">
  <button class="tap tap--prev" type="button" aria-label="Previous screen"></button>
  <button class="tap tap--next" type="button" aria-label="Next screen"></button>
</main>

<p class="title" aria-live="polite"><small id="count">01 / 08</small><b id="name">It’s Beyond Roots</b></p>
<nav class="dots" aria-label="Jump to a screen"></nav>
<p class="hint">Tap the right side for next, the left side for back, or use ← →</p>

<script>
(function () {
  "use strict";
  // Titles are the headings shown on each screen.
  var titles = ["It’s Beyond Roots", "Resting Status", "The Living Collection", "Lebanese Emmer Wheat",
                "The Seed Journey", "Arctic Sovereign Backup", "Scan Seed Passport", "LARI Central Station"];
  var imgs = [].slice.call(document.querySelectorAll(".phone img"));
  var dotsBox = document.querySelector(".dots"), count = document.getElementById("count"), name = document.getElementById("name");
  var current = 0;

  var dots = titles.map(function (t, i) {
    var b = document.createElement("button");
    b.type = "button"; b.setAttribute("aria-label", (i + 1) + ". " + t);
    b.addEventListener("click", function () { show(i); });
    dotsBox.appendChild(b); return b;
  });

  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function show(i) {
    i = (i + imgs.length) % imgs.length;            // wraps around: after the last screen comes the first
    imgs[current].classList.remove("is-on");
    imgs[i].classList.add("is-on");
    dots[current].setAttribute("aria-current", "false");
    dots[i].setAttribute("aria-current", "true");
    count.textContent = pad(i + 1) + " / " + pad(imgs.length);
    name.textContent = titles[i];
    current = i;
  }

  document.querySelector(".tap--next").addEventListener("click", function () { show(current + 1); });
  document.querySelector(".tap--prev").addEventListener("click", function () { show(current - 1); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") { e.preventDefault(); show(current + 1); }
    if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); show(current - 1); }
    if (e.key === "Home") show(0);
    if (e.key === "End") show(imgs.length - 1);
  });

  // Swipe on touch screens (a quick left/right drag), on top of the tap halves.
  var x0 = null;
  var phone = document.querySelector(".phone");
  phone.addEventListener("touchstart", function (e) { x0 = e.touches[0].clientX; }, { passive: true });
  phone.addEventListener("touchend", function (e) {
    if (x0 === null) return;
    var dx = e.changedTouches[0].clientX - x0; x0 = null;
    if (Math.abs(dx) > 40) { e.preventDefault(); show(current + (dx < 0 ? 1 : -1)); }
  });

  show(0);
})();
</script>
</body>
</html>
